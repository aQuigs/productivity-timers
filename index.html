<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)">
    <title>Productivity Timers</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8f55a'/%3E%3Ccircle cx='16' cy='16.5' r='8.5' fill='none' stroke='%23111405' stroke-width='2.5'/%3E%3Cpath d='M16 11.5v5l3.5 2.2' fill='none' stroke='%23111405' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12.5" r="8"/>
                        <path d="M12 8v4.5l3 2"/>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Productivity Timers</h1>
                    <p class="subtitle">One clock runs at a time</p>
                </div>
            </div>

            <div class="summary" title="Total time across all timers">
                <span class="summary-label">Total</span>
                <span id="total-time" class="summary-value">00:00:00</span>
            </div>

            <div class="controls">
                <button id="reset-all-btn" class="btn btn-secondary btn-reset" type="button">Reset all</button>
                <button id="add-timer-btn" class="btn btn-primary" type="button">Add timer</button>
            </div>
        </header>

        <main>
            <div id="timer-container" class="timer-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
